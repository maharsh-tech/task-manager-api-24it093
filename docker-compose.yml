services:
  mongodb:
    image: mongo:7
    container_name: taskdb-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskdb-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/taskdb
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: practical7-dev-secret-change-in-production-24it093
      JWT_EXPIRES_IN: 1h
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ../maharshsolanki-v2
      dockerfile: Dockerfile
    container_name: taskdb-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
